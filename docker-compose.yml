services:
  api:
    build: .
    container_name: whyquiet-api
    command: uv run uvicorn src.api.main:app --host 0.0.0.0 --port 8008
    ports:
      - "8008:8008"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8008
      - ENVIRONMENT=production
    volumes:
      - ./config:/app/config:ro
      - ./results:/app/results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  dashboard:
    build: .
    container_name: whyquiet-dashboard
    command: uv run streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8008
    depends_on:
      - api
    volumes:
      - ./config:/app/config:ro
      - ./results:/app/results:ro
