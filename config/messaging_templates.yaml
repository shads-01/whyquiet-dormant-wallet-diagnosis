# WhyQuiet Template-First Messaging Configuration
# DISCLAIMER: Templates designed for demonstration; production deployment requires native Bangla review.
# All amounts and codes are injected programmatically from the allocation engine (never LLM-generated).

disclaimer: "All message copy is template-driven with programmatically injected values. Native speaker review recommended before field deployment."

templates:
  fee_shock:
    A3:
      sms:
        bn: "আপনার ওয়ালেটে ক্যাশ-আউটের ফি নিয়ে চিন্তা? আগামী {validity_days} দিনের মধ্যে ক্যাশ-আউটে পাচ্ছেন ৳{amount_bdt} পর্যন্ত ১০০% ফি ফেরত! ডায়াল {ussd_code}"
        en: "Worried about cash-out fees? Enjoy 100% cash-out fee refund up to ৳{amount_bdt} for the next {validity_days} days. Dial {ussd_code}"
      push:
        bn: "ক্যাশ-আউটে পুরো ফি ফেরত! আপনার জন্য ৳{amount_bdt} ফি ওয়েভার যোগ হয়েছে। ট্যাপ করে লেনদেন করুন।"
        en: "100% Cash-out fee refund! ৳{amount_bdt} fee waiver applied to your account. Tap to transact."
    A0:
      sms:
        bn: "এখন অ্যাপে এবং {ussd_code} ডায়াল করে যেকোনো ইউটিলিটি বিল দিন সম্পূর্ণ ফ্রিতে, কোনো অতিরিক্ত চার্জ ছাড়াই।"
        en: "Pay any utility bill with zero extra fees directly from your wallet. Dial {ussd_code}"
      push:
        bn: "জিরো চার্জে বিল পে! ওয়ালেট দিয়ে সহজেই বিল পরিশোধ করুন সম্পূর্ণ ফ্রিতে।"
        en: "Zero charge bill payments! Pay your utility bills instantly with zero added fee."

