        en: "Adequate cash float is now restored at your nearest agent ({agent_name}). Visit now for smooth cash services."
      push:
        bn: "নিকটস্থ এজেন্টে ক্যাশ রেডি! আপনার কাছেই {agent_name} পয়েন্টে নিরবচ্ছিন্ন ক্যাশ-আউট সেবা পান।"
        en: "Cash ready nearby! Visit {agent_name} for instant cash-out services."
    A0:
      sms:
        bn: "নেটওয়ার্ক সমস্যার সমাধান হয়েছে। যেকোনো সময় সহজে ব্যালেন্স চেক বা লেনদেন করতে ডায়াল করুন {ussd_code}"
