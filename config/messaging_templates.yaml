        bn: "আপনার প্রিয় মার্চেন্টে কেনাকাটা বা পেমেন্টে পাচ্ছেন ৳{amount_bdt} ইনস্ট্যান্ট ক্যাশব্যাক! অফারটি চলবে {validity_days} দিন।"
